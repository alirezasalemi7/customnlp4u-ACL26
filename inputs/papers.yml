- abstract: Accurate and timely diagnosis is essential for effective treatment, particularly
    in the context of rare diseases. However, current diagnostic workflows often lead
    to prolonged assessment times and low accuracy. To address these limitations,
    we introduce Hygieia, an adaptive AI agent system designed to support precision
    disease diagnosis by integrating diverse data sources, including phenotypic features,
    genetic profiles, and clinical records. Hygieia features a router-based and knowledge-enhanced
    framework that mitigates hallucination and tailors diagnostic strategies to different
    disease categories. Notably, it prioritizes risk-related genomic factors for rare
    diseases and provides confidence scores to assist clinical decision-making. We
    conducted a comprehensive evaluation demonstrating that Hygieia achieves state-of-the-art
    performance across multiple diagnostic benchmarks. In collaboration with clinical
    experts from Yale School of Medicine and Duke-NUS Medical School, we further validated
    its practical utility by showing (1) Hygieia's superior diagnostic performance
    compared to physicians and (2) its effectiveness in assisting clinicians with
    medical records for handling real-world cases. Our findings indicate that Hygieia
    not only enhances diagnostic accuracy and interpretability but also significantly
    reduces clinician workload, highlighting its potential as a valuable tool in clinical
    decision support systems.
