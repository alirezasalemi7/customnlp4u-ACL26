- abstract: 'The presence of factuality errors (hallucinations) in the outputs of
    patient-facing medical chatbots is a serious problem: they can lead to patient
    harm and erode people''s trust in the medical profession. For this reason, it
    is crucial to detect hallucinations in chatbot outputs and forward them to clinicians
    for review. In this paper, we present the system we built for detecting such errors:
    it consists of multiple LLM-powered detectors which are combined together with
    a novel alignment procedure. We ran our system on the MedExpert-Benchmark dataset
    (Yarmohammadi et al., 2025) and our results on two use cases, Mental Health and
    Prenatal Care, show that the combined system gives nice gains over the individual
    systems. Additionally, we show that further customization of the system to each
    one of the use cases leads to further gains, but at the cost of reduced generalizability.
    Our code and dataset are available here: https://github.com/BBN-E/medic-customnlp4u.'
