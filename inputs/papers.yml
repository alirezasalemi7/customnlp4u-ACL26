- abstract: "Small language models often struggle with complex mathematical reasoning\
    \ due to limited capacity to maintain long chains of intermediate steps and to\
    \ recover from early errors. We address this challenge by introducing a hint-assisted\
    \ reasoning framework that incrementally guides small language models through\
    \ multi-step mathematical problem solving. Our approach decomposes solutions into\
    \ sequential reasoning steps and provides context-aware hints, where hints are\
    \ generated by a separate small language model trained via distillation from a\
    \ stronger LLM. While the hint-generating SLM alone is not capable of solving\
    \ the problems, its collaboration with a reasoning SLM enables effective guidance,\
    \ forming a cooperative two-model system for reasoning. Each hint is generated\
    \ conditionally on the problem statement and the accumulated reasoning history,\
    \ providing stepwise, localized guidance without revealing full solutions. This\
    \ reduces error propagation and allows the reasoning model to focus on manageable\
    \ subproblems. Experiments across diverse mathematical benchmarks and models demonstrate\
    \ that hint assistance consistently improves reasoning accuracy for small language\
    \ models, yielding substantial gains over standard prompting while preserving\
    \ model efficiency. These results highlight that structured collaboration between\
    \ small models\u2014via hint generation and reasoning\u2014offers an effective\
    \ and lightweight mechanism for enhancing mathematical reasoning."
