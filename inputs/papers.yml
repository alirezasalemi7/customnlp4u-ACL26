- abstract: Research in language documentation has the potential to benefit from integration
    of ASR models, especially through the assisted transcription of recordings with
    audio. Recent advancements in ASR for low-resource languages demonstrate the ability
    to adapt general, multilingual models for unseen languages with limited fine-tuning
    data, supporting the creation of custom ASR models. However, resources are still
    required to collect and prepare the fine-tuning data, necessitating exploration
    of optimization of resource allocation within the process of data collection and
    preparation. This paper outlines important considerations for the collection and
    preparation of data for customizing an ASR model for use in language documentation
    projects. With the development of a Lamkang ASR model as an example, prioritization
    of tasks within a language documentation project is outlined by analyzing the
    relative impact of time spent on transcription correction versus time spent on
    manual alignment on ASR model performance. Results from this research suggest
    prioritization of transcription correction over manual-alignment of data and suggest
    fine-tuning multilingual ASR systems produces superior results to zero-shot ASR
    models, despite recent advancements in the technology.
