- abstract: 'Utilizing LLMs for automated taxonomy construction presents a clear opportunity
    for the comprehensive, yet efficient mapping of potentially complex domains. When
    contending with high volumes of rapidly growing corpora, however, it becomes unclear
    how to best leverage such data for optimal taxonomy construction. Taking the case
    of systematizing *AI skills in the workplace*, we use two large-scale job postings
    corpora to investigate key design decisions for the inclusion (or exclusion) of
    data points for taxonomy construction. We propose **TaxonomyBuilder** as a blueprint
    for our systematic study, with which we evaluate various configurations of custom,
    data-informed, and hierarchical taxonomies. We demonstrate that *less* data can
    provide more clarity: filtering inputs to **TaxonomyBuilder** provides better
    domain-specific coverage than offering unfiltered inputs to clustering and LLM-enhanced
    hierarchical taxonomy labeling tools.'
