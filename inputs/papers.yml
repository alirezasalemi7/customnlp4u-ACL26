- abstract: Low-resource authorship style transfer (LAST) aims to rewrite text in
    the style of an arbitrary target author using only a few reference examples while
    preserving the original meaning. Existing methods often struggle to achieve both
    high style fidelity and semantic preservation because they compress diverse references
    into a single static author embedding, which averages out context-dependent stylistic
    variation, and rely on hidden representations for style control, which entangle
    style with content. We propose HyperStyler, a novel architecture that decouples
    LAST into style inference and style realization. Stylo-navigator predicts context-dependent
    style coordinates by jointly modeling the source context and target-author references,
    while Stylo-hypernet realizes them via dynamic parameter modulation instead of
    hidden-state injection. By shifting authorship control to the parameter space,
    HyperStyler enables more faithful and controllable style transfer with reduced
    semantic interference. Experiments on Reddit, Blog, and News show that HyperStyler
    consistently outperforms prior methods, generalizes robustly across domains, and
    requires only a 2.4\% increase in parameters.
