- abstract: "Retrieval-augmented generation (RAG) is widely used in domain-specific\
    \ and knowledge-intensive applications, where long prompts increase inference\
    \ cost and may exceed context limits. Prompt compression is therefore appealing,\
    \ but existing evaluations focus primarily on answer quality, overlooking whether\
    \ compressed systems remain faithful to the retrieved evidence. In this paper,\
    \ we ask: does compression that preserves answers also preserve grounding? Using\
    \ Self-RAG and LLMLingua-2 in a controlled setting, we evaluate compressed RAG\
    \ on ASQA in terms of both answer correctness and citation grounding. Under increasing\
    \ compression, answer correctness drops by only 2-4%, whereas grounding drops\
    \ by 40-50\\%. This stark divergence shows that answer\u2011only evaluation can\
    \ substantially overestimate the reliability of compressed RAG in evidence\u2011\
    aware scenarios. We further propose a lightweight hierarchical compression strategy\
    \ that prioritizes evidence\u2011bearing spans. It recovers nearly all grounding\
    \ loss while maintaining comparable answer quality. Our results reveal a clear\
    \ trade\u2011off between efficiency and verifiability, and suggest that compression\
    \ in RAG should be customized to downstream verification needs rather than treated\
    \ as a one\u2011size\u2011fits\u2011all efficiency intervention."
