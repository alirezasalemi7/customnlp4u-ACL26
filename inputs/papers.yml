- abstract: "Vision Language Models (VLMs) are poised to revolutionize the digital\
    \ transformation of pharmacyceutical industry by enabling intelligent, scalable,\
    \ and automated multi-modality content processing. Traditional manual annotation\
    \ of heterogeneous data modalities (text, images, video, audio, and web links),\
    \ is prone to inconsistencies, quality degradation, and inefficiencies in content\
    \ utilization. The sheer volume of long video and audio data further exacerbates\
    \ these challenges, (e.g. long clinical trial interviews and educational seminars).\
    \ Here, we introduce a domain-adapted Video-to-Video Clip Generation framework\
    \ that integrates Audio-Language Models (ALMs) and Vision Language Models (VLMs)\
    \ to produce highlight clips. Our contributions are threefold: (i) a reproducible\
    \ Cut & Merge algorithm with fade-in/out and timestamp normalization, ensuring\
    \ smooth transitions and audio/visual alignment; (ii) a personalization mechanism\
    \ based on role definition and prompt injection for tailored outputs (marketing,\
    \ training, regulatory); (iii) a cost-efficient e2e pipeline strategy balancing\
    \ ALM/VLM-enhanced processing. Evaluations on Video-MME benchmark (900) and our\
    \ proprietary dataset of 16,159 pharmacy videos across 14 disease areas demonstrate\
    \ 3\u20134\xD7 speedup, 4\xD7 cost reduction, and competitive clip quality. Beyond\
    \ efficiency gains, we also report our methods improved clip coherence scores\
    \ (0.348) and informativeness scores (0.721) over state-of-the-art VLM baselines\
    \ (e.g., Gemini 2.5 Pro), highlighting the potential of transparent, custom extractive,\
    \ and compliance-supporting video summarization for life sciences. Demo: https://video-clips-highlight-generator-338849523617.us-west1.run.app/."
